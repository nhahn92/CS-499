<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Travel</h2>

    <!-- Admin-only Add Trip button -->
    <button *ngIf="loggedIn" (click)="addTrip()" class="btn btn-primary">
      Add Trip
    </button>
  </div>

  <!-- Search Bar -->
  <div class="mb-3">
    <input type="text"
           class="form-control"
           placeholder="Search Travel"
           [(ngModel)]="searchTerm"
           (input)="applySearch()">
  </div>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Length</th>
        <th>Start</th>
        <th>Resort</th>
        <th>Per Person</th>

        <!-- Admin-only Actions column -->
        <th *ngIf="loggedIn">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let trip of paginatedTrips">
        <td>{{ trip.code }}</td>
        <td>{{ trip.name }}</td>
        <td>{{ trip.length }}</td>
        <td>{{ trip.start | date:'mediumDate' }}</td>
        <td>{{ trip.resort }}</td>
        <td>{{ +trip.perPerson | currency:'USD':'symbol' }}</td>

        <!-- Admin-only Edit/Delete buttons -->
        <td *ngIf="loggedIn" class="action-buttons">
          <button class="btn btn-edit" (click)="editTrip(trip)">Edit</button>
          <button class="btn btn-delete" (click)="deleteTrip(trip)">×</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Controls -->
  <div class="d-flex justify-content-between align-items-center mt-3">

    <button class="btn pagination-btn"
            (click)="prevPage()"
            [disabled]="currentPage === 1">
      Previous
    </button>

    <span>Page {{ currentPage }} of {{ totalPages }}</span>

    <button class="btn pagination-btn"
            (click)="nextPage()"
            [disabled]="currentPage === totalPages">
      Next
    </button>

  </div>

</div>
